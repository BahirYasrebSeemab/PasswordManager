name: Keep API warm

# Render's free web services sleep after 15 minutes without traffic, and the first request
# after that waits ~50 s for a cold start. Pinging /health every 10 minutes keeps the API
# awake for anyone trying the demo.
#
# /health does not touch the database, so Neon still sleeps when idle. That is on purpose:
# Neon wakes in well under a second, and keeping it awake would use up the free plan's
# monthly compute hours.
#
# Uses about 730 of Render's 750 free instance hours a month, so it fits only if this is
# your one always-on free Render service. Keep the repo public: on a private repo these
# runs would cost about 4,300 Actions minutes a month (the free allowance is 2,000).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write # only to re-enable this workflow (see the last step)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: |
          curl --fail-with-body -sS --retry 2 --retry-delay 20 --max-time 90 \
            https://passwordmanager-rskp.onrender.com/health
          echo

      - name: Keep this schedule from being disabled
        # GitHub turns off scheduled workflows after 60 days without repo activity.
        # Re-enabling the workflow through the API resets that timer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keep-render-warm.yml/enable"
